on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
        pytest-version: ["7.3", "7.4", "8.0", "8.1", "8.2", "8.3", "9.0", "9.1"]
    steps:
    - uses: actions/checkout@v4
    - name: Install OpenMPI
      run: |
        sudo apt-get update
        sudo apt-get -y install libopenmpi-dev
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest~=${{ matrix.pytest-version }}.0 ".[dev]"
    - name: Run linters
      continue-on-error: true
      run: |
        make lint
    - name: Run test suite
      # Export the oversubscription toggle under both the OpenMPI 4.x
      # (OMPI_MCA_) and the OpenMPI 5.x/prte (PRTE_MCA_) variable names;
      # each version ignores the variable it does not know.
      run: |
        make OMPI_MCA_rmaps_base_oversubscribe=true "PRTE_MCA_rmaps_default_mapping_policy=:oversubscribe" test    
